name: Verify and Deploy Gwent Definitive

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Engine, fuzz, PWA, motion, direct-manipulation, choreography, and feel validation
        run: npm test
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser QA tooling
        run: |
          python -m pip install -r requirements-ci.txt
          python -m playwright install --with-deps chromium webkit
      - name: Start static test server
        run: |
          python -m http.server 4173 >/tmp/gwent-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/gwent-http.log
          exit 1
      - name: Battlefield density, centering, and geometry gate
        env:
          GWENT_TEST_URL: http://127.0.0.1:4173/
        run: python tests/ui_smoke.py
      - name: Direct manipulation baseline, overlap, parity, interruption, reduced-motion, and touch gate
        env:
          GWENT_TEST_URL: http://127.0.0.1:4173/
        run: python tests/direct_manipulation_ui_v4.py
      - name: Destination-family tap/drag parity gate
        env:
          GWENT_TEST_URL: http://127.0.0.1:4173/
        run: python tests/direct_manipulation_destinations.py
      - name: Presentation-aware bot turn gate
        env:
          GWENT_TEST_URL: http://127.0.0.1:4173/
        run: python tests/presentation_turn_gate_ui.py
      - name: Disposable presentation-failure recovery gate
        env:
          GWENT_TEST_URL: http://127.0.0.1:4173/
        run: python tests/presentation_failure_recovery.py
      - name: 256-trial physical interaction stress gate
        env:
          GWENT_TEST_URL: http://127.0.0.1:4173/
        run: python tests/direct_manipulation_stress.py
      - name: Semantic landing continuity and durable feedback gate
        env:
          GWENT_TEST_URL: http://127.0.0.1:4173/
        run: python tests/interaction_polish_ui.py
      - name: Last-card, visibility interruption, and save-restore lifecycle gate
        env:
          GWENT_TEST_URL: http://127.0.0.1:4173/
        run: python tests/direct_manipulation_lifecycle.py
      - name: WebKit / iPhone-targeted interaction gate
        env:
          GWENT_TEST_URL: http://127.0.0.1:4173/
        run: python tests/direct_manipulation_webkit.py
      - name: Pass 10.4B signature choreography, reduced-motion, and interruption gate
        env:
          GWENT_TEST_URL: http://127.0.0.1:4173/
        run: python tests/gameplay_choreography_ui.py
      - name: Pass 10.4B adversarial choreography matrix
        env:
          GWENT_TEST_URL: http://127.0.0.1:4173/
        run: python tests/gameplay_choreography_stress.py
      - name: Pass 10.4C feel, feedback, reduced-motion, and pacing gate
        env:
          GWENT_TEST_URL: http://127.0.0.1:4173/
        run: python tests/feel_presentation_ui.py
      - name: Archive Pass 10.3 battlefield visual QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pass10-3-battlefield-visual-qa
          path: qa/pass10_3
          if-no-files-found: warn
          retention-days: 30
      - name: Archive Pass 10.4A interaction visual QA and stress results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pass10-4a-direct-manipulation-qa
          path: qa/pass10_4a
          if-no-files-found: warn
          retention-days: 30
      - name: Archive Pass 10.4B choreography visual QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pass10-4b-signature-choreography-qa
          path: qa/pass10_4b
          if-no-files-found: warn
          retention-days: 30
      - name: Archive Pass 10.4C feel and presentation visual QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pass10-4c-feel-presentation-qa
          path: qa/pass10_4c
          if-no-files-found: warn
          retention-days: 30

  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Stage production site
        run: |
          rm -rf _site
          mkdir -p _site/src _site/icons
          cp index.html app.js styles.css battlefield-ux.css direct-manipulation.css gameplay-choreography.css feel-polish.css manifest.webmanifest sw.js icon.svg .nojekyll _site/
          cp src/cards-catalog.js src/gwent-engine.js src/asset-resolver.js src/storage.js src/battlefield-ux.js src/motion-tokens.js src/presentation-queue.js src/interaction-turn-gate.js src/presentation-events.js src/gameplay-choreography.js src/choreography-external-gate.js src/flip-layout.js src/gesture-controller.js src/presentation-feedback.js _site/src/
          cp icons/apple-touch-icon.png icons/icon-192.png icons/icon-512.png _site/icons/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
