name: Verify and Deploy Gwent Definitive

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Engine, fuzz, and PWA validation
        run: npm test
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser QA tooling
        run: |
          python -m pip install -r requirements-ci.txt
          python -m playwright install --with-deps chromium
      - name: Start static test server
        run: |
          python -m http.server 4173 >/tmp/gwent-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/gwent-http.log
          exit 1
      - name: Mobile interaction, density, centering, and geometry gate
        env:
          GWENT_TEST_URL: http://127.0.0.1:4173/
        run: python tests/ui_smoke.py
      - name: Archive Pass 10.3 battlefield visual QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pass10-3-battlefield-visual-qa
          path: qa/pass10_3
          if-no-files-found: warn
          retention-days: 30

  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Stage production site
        run: |
          rm -rf _site
          mkdir -p _site/src _site/icons
          cp index.html app.js styles.css battlefield-ux.css manifest.webmanifest sw.js icon.svg .nojekyll _site/
          cp src/cards-catalog.js src/gwent-engine.js src/asset-resolver.js src/storage.js src/battlefield-ux.js _site/src/
          cp icons/apple-touch-icon.png icons/icon-192.png icons/icon-512.png _site/icons/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
